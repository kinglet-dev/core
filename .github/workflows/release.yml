name: Release

# Pushing a version tag (v1.2.3) runs the tests and drafts a GitHub release
# with the notes from CHANGELOG.md. core is a Go library: Go fetches it
# by tag, so there are no binaries. The draft is published by hand after
# a last look.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Tests with race detector and coverage
        run: |
          go vet ./...
          go tool ginkgo -r --race --cover --coverprofile=coverage.out
          scripts/check-coverage.sh coverage.out
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --draft --verify-tag --title "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/notes.md"
